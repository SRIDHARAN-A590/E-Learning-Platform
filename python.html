<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Study Materials</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f4f6f9;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    .topic {
        background: #fff;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    button {
        margin-left: 10px;
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .complete-btn { background: #28a745; color: white; }
    .view-btn { background: #007bff; color: white; }
    .reset-btn { background-color: #f44336; color: white; display: block; margin: 20px auto; }
    .completed { text-decoration: line-through; color: gray; }
    .back-to-home{background-color: #f44336;color:white;text-decoration: none;}
    a{text-decoration: none;color:white}
    #jarvis {
        margin-top: 15px;
        padding: 15px;
        background: #fff3cd;
        border: 1px solid #ffeeba;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        color: #856404;
    }
    /* Modal styles */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
    }
    .modal-content {
        background: white;
        margin: 10% auto;
        padding: 20px;
        width: 60%;
        border-radius: 8px;
        position: relative;
    }
    .close {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 20px;
        cursor: pointer;
        color: red;
    }
    pre {
        background: #f8f9fa;
        padding: 10px;
        border-radius: 5px;
    }
</style>
</head>
<body>
<button class="back-to-home"><a href="homepage.html">Back to home</a></button>
<h1>Python</h1>

<div id="topics"></div>

<button class="reset-btn" onclick="resetAll()">Reset All</button>

<div id="jarvis">💡 For any doubts, Jarvis can assist you.</div>

<!-- Modal -->
<div id="materialModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation"></p>
        <h3>Example:</h3>
        <pre id="modalExample"></pre>
        <h3>Output:</h3>
        <pre id="modalOutput"></pre>
    </div>
</div>

<script>
const topics = [
    { title: "Introduction to Python", explanation: "Python is a high-level, interpreted programming language known for its readability and versatility.", example: `print("Hello, Python!")`, output: `Hello, Python!` },
    { title: "Data Types and Variables", explanation: "Variables store data. Python supports various data types like int, float, str, and bool.", example: `x = 10\nname = "Alice"\nprint(type(x), type(name))`, output: `<class 'int'> <class 'str'>` },
    { title: "Conditionals and Loops", explanation: "Conditionals (if/else) and loops (for/while) control the program flow.", example: `for i in range(3):\n    print(i)`, output: `0\n1\n2` },
    { title: "Functions and Modules", explanation: "Functions group code into reusable blocks. Modules are files with Python code you can import.", example: `def greet(name):\n    return f"Hello, {name}"\nprint(greet("Bob"))`, output: `Hello, Bob` },
    { title: "Lists, Tuples, and Dictionaries", explanation: "Lists are mutable sequences, tuples are immutable, and dictionaries store key-value pairs.", example: `fruits = ["apple", "banana"]\nprint(fruits[0])`, output: `apple` },
    { title: "File Handling", explanation: "Python allows reading and writing files using open().", example: `with open("file.txt", "w") as f:\n    f.write("Hello File")`, output: `File 'file.txt' created with text.` },
    { title: "Object-Oriented Programming", explanation: "OOP organizes code into classes and objects.", example: `class Person:\n    def __init__(self, name):\n        self.name = name\n    def greet(self):\n        return f"Hi, I'm {self.name}"\nprint(Person("Tom").greet())`, output: `Hi, I'm Tom` },
    { title: "Exception Handling", explanation: "Exceptions handle runtime errors gracefully.", example: `try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    print("Cannot divide by zero")`, output: `Cannot divide by zero` },
    { title: "Working with Libraries (NumPy, Pandas)", explanation: "NumPy is for numerical computing, Pandas is for data analysis.", example: `import numpy as np\nimport pandas as pd\nprint(np.array([1,2,3]))`, output: `[1 2 3]` }
];

function loadTopics() {
    const container = document.getElementById("topics");
    container.innerHTML = "";
    const completed = JSON.parse(localStorage.getItem("pythonCompleted")) || {};

    topics.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "topic";
        div.innerHTML = `
            <span class="${completed[i] ? 'completed' : ''}">${t.title}</span>
            <div>
                <button class="complete-btn" onclick="markCompleted(${i})">Mark as Completed</button>
                <button class="view-btn" onclick="viewMaterial(${i})">View Materials</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function markCompleted(index) {
    const completed = JSON.parse(localStorage.getItem("pythonCompleted")) || {};
    completed[index] = true;
    localStorage.setItem("pythonCompleted", JSON.stringify(completed));
    loadTopics();
}

function resetAll() {
    localStorage.removeItem("pythonCompleted");
    loadTopics();
}

function viewMaterial(index) {
    const t = topics[index];
    document.getElementById("modalTitle").innerText = t.title;
    document.getElementById("modalExplanation").innerText = t.explanation;
    document.getElementById("modalExample").innerText = t.example;
    document.getElementById("modalOutput").innerText = t.output;
    document.getElementById("materialModal").style.display = "block";
}

function closeModal() {
    document.getElementById("materialModal").style.display = "none";
}

window.onload = loadTopics;
</script>

</body>
</html>
