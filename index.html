<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnLearn - Get Started</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }
    header {
      background-color: white;
      display: flex;
      align-items: center;
      padding: 15px 30px;
      border-bottom: 2px solid #e0e0e0;
    }
    header img {
      height: 50px;
      margin-right: 15px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: bold;
      color: #007bff;
      margin: 0;
    }
    .banner {
      width: 100%;
      margin-bottom: 30px;
    }
    .banner img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .get-started-section {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: auto;
    }
    .btn-primary {
      padding: 12px 25px;
      font-size: 1.2rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Header with Logo -->
  <header>
    <img src="homepageimages\logo.jpeg" alt="OnLearn Logo">
    <h1>OnLearn</h1>
  </header>

  <!-- Banner Image -->
  <div class="banner">
    <img src="homepageimages\homepageimg.jpg" alt="Master Programming with Jarvis AI Assistant">
  </div>

  <!-- Get Started Section -->
  <div class="get-started-section">
    <h2>Welcome to OnLearn!</h2>
    <p>
      Your journey to mastering programming starts here.  
      Learn Java, JavaScript, C, and Python with your personal AI mentor Jarvis.  
      Get instant help, personalized study materials, and accelerated learning paths.
    </p>
    <a href="login.html" class="btn btn-primary">Get Started Now</a>
  </div>

</body>
</html>
