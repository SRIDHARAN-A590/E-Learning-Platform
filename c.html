<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Programming Study Materials</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f4f4f4;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    .topic {
        background: #fff;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    button {
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
    }
    .complete-btn { background-color: #4CAF50; color: white; }
    .view-btn { background-color: #2196F3; color: white; margin-left: 5px; }
    .reset-btn { background-color: #f44336; color: white; display: block; margin: 20px auto; }
    .completed { text-decoration: line-through; color: gray; }
    .back-to-home{background-color: #f44336;color:white;text-decoration: none;}
    a{text-decoration: none;color:white;}
    .jarvis {
        margin-top: 15px;
        padding: 15px;
        background: #fff3cd;
        border: 1px solid #ffeeba;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        color: #856404;
    }
    /* Modal styles */
    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        padding-top: 100px;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
        background-color: white;
        margin: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 50%;
        border-radius: 8px;
    }
    .close {
        color: #aaa;
        float: right;
        font-size: 24px;
        font-weight: bold;
    }
    .close:hover { color: black; cursor: pointer; }
</style>
</head>
<body>
<button class="back-to-home"><a href="homepage.html">Back to home</a></button>
<h1>C</h1>

<div id="topics"></div>

<button class="reset-btn" onclick="resetAll()">Reset All</button>

<div class="jarvis">💡 For any doubts, Jarvis can assist you!</div>

<!-- Modal -->
<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle"></h2>
    <p id="modalExplanation"></p>
    <pre id="modalExample"></pre>
    <pre id="modalOutput"></pre>
  </div>
</div>

<script>
const topicsData = [
    {
        title: "Introduction to C",
        explanation: "C is a general-purpose, procedural programming language developed in the early 1970s by Dennis Ritchie. It is widely used for system and application software.",
        example: `#include <stdio.h>
int main() {
    printf("Hello, World!");
    return 0;
}`,
        output: "Hello, World!"
    },
    {
        title: "Data Types and Variables in C",
        explanation: "C has several basic data types such as int, float, char, and double. Variables are named storage locations used to hold values.",
        example: `#include <stdio.h>
int main() {
    int age = 20;
    float height = 5.9;
    char grade = 'A';
    printf("Age: %d\\nHeight: %.1f\\nGrade: %c", age, height, grade);
    return 0;
}`,
        output: `Age: 20
Height: 5.9
Grade: A`
    },
    {
        title: "Conditionals and Loops in C",
        explanation: "Conditionals (if, else, switch) control the flow of execution. Loops (for, while, do-while) repeat blocks of code.",
        example: `#include <stdio.h>
int main() {
    int i;
    for(i=1; i<=5; i++) {
        printf("%d ", i);
    }
    return 0;
}`,
        output: "1 2 3 4 5"
    },
    {
        title: "Functions in C",
        explanation: "Functions allow code to be organized into reusable blocks. C has predefined and user-defined functions.",
        example: `#include <stdio.h>
void greet() {
    printf("Hello from a function!\\n");
}
int main() {
    greet();
    return 0;
}`,
        output: "Hello from a function!"
    },
    {
        title: "Arrays and Strings in C",
        explanation: "Arrays are collections of the same data type. Strings in C are arrays of characters ending with a null character.",
        example: `#include <stdio.h>
int main() {
    char name[] = "C Language";
    printf("Name: %s", name);
    return 0;
}`,
        output: "Name: C Language"
    },
    {
        title: "Pointers in C",
        explanation: "Pointers are variables that store memory addresses. They are powerful tools in C for memory management.",
        example: `#include <stdio.h>
int main() {
    int x = 10;
    int *p = &x;
    printf("Value: %d\\nAddress: %p", *p, p);
    return 0;
}`,
        output: "Value: 10\nAddress: [some memory address]"
    },
    {
        title: "Structures and Unions",
        explanation: "Structures group different data types under one name. Unions share memory among members.",
        example: `#include <stdio.h>
struct Student {
    char name[20];
    int age;
};
int main() {
    struct Student s1 = {"John", 21};
    printf("Name: %s, Age: %d", s1.name, s1.age);
    return 0;
}`,
        output: "Name: John, Age: 21"
    },
    {
        title: "File Handling in C",
        explanation: "C provides functions like fopen, fprintf, fscanf, and fclose for file operations.",
        example: `#include <stdio.h>
int main() {
    FILE *f = fopen("test.txt", "w");
    fprintf(f, "Hello File");
    fclose(f);
    return 0;
}`,
        output: "A file named test.txt is created with content: Hello File"
    },
    {
        title: "Dynamic Memory Allocation",
        explanation: "C supports dynamic memory allocation using malloc, calloc, realloc, and free.",
        example: `#include <stdio.h>
#include <stdlib.h>
int main() {
    int *arr = (int*)malloc(3 * sizeof(int));
    arr[0] = 10; arr[1] = 20; arr[2] = 30;
    for(int i=0; i<3; i++) printf("%d ", arr[i]);
    free(arr);
    return 0;
}`,
        output: "10 20 30"
    }
];

function loadTopics() {
    const container = document.getElementById("topics");
    container.innerHTML = "";
    topicsData.forEach((topic, index) => {
        const topicDiv = document.createElement("div");
        topicDiv.className = "topic";
        
        const titleSpan = document.createElement("span");
        titleSpan.textContent = topic.title;
        if (localStorage.getItem(`c_topic_${index}`) === "completed") {
            titleSpan.classList.add("completed");
        }

        const btnContainer = document.createElement("div");
        
        const completeBtn = document.createElement("button");
        completeBtn.textContent = "Mark as Completed";
        completeBtn.className = "complete-btn";
        completeBtn.onclick = () => {
            localStorage.setItem(`c_topic_${index}`, "completed");
            loadTopics();
        };
        
        const viewBtn = document.createElement("button");
        viewBtn.textContent = "View Materials";
        viewBtn.className = "view-btn";
        viewBtn.onclick = () => openModal(topic);
        
        btnContainer.appendChild(completeBtn);
        btnContainer.appendChild(viewBtn);

        topicDiv.appendChild(titleSpan);
        topicDiv.appendChild(btnContainer);
        container.appendChild(topicDiv);
    });
}

function resetAll() {
    topicsData.forEach((_, index) => {
        localStorage.removeItem(`c_topic_${index}`);
    });
    loadTopics();
}

function openModal(topic) {
    document.getElementById("modalTitle").textContent = topic.title;
    document.getElementById("modalExplanation").textContent = "📖 Explanation:\n" + topic.explanation;
    document.getElementById("modalExample").textContent = "💻 Example:\n" + topic.example;
    document.getElementById("modalOutput").textContent = "🖥 Output:\n" + topic.output;
    document.getElementById("myModal").style.display = "block";
}

function closeModal() {
    document.getElementById("myModal").style.display = "none";
}

window.onload = loadTopics;
</script>

</body>
</html>
