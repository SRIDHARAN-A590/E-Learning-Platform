<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Study Materials</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f9f9f9;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    .topic {
        background: #fff;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    button {
        padding: 8px 12px;
        margin-left: 8px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        color: white;
    }
    .complete-btn { background: #28a745; }
    .view-btn { background: #007bff; }
     .reset-btn { background-color: #f44336; color: white; display: block; margin: 20px auto; }
    .completed { text-decoration: line-through; color: gray; }
    .back-to-home{background-color: #f44336;color:white;text-decoration: none;}
    a{text-decoration: none;color:white}
    .jarvis {
        margin-top: 20px;
        background: #fff3cd;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ffeeba;
        text-align: center;
        font-weight: bold;
    }
    /* Modal styles */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
    }
    .modal-content {
        background: #fff;
        margin: 10% auto;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        max-width: 700px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .close {
        color: red;
        float: right;
        font-size: 24px;
        cursor: pointer;
    }
    pre {
        background: #f4f4f4;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
    }
</style>
</head>
<body>
<button class="back-to-home"><a href="homepage.html">Back to home</a></button>
<h1>Java</h1>

<div id="topics"></div>

<button class="reset-btn" onclick="resetAll()">Reset All</button>

<div class="jarvis">💡 For any doubts, Jarvis can assist you</div>

<!-- Modal -->
<div id="materialModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle"></h2>
    <p id="modalExplanation"></p>
    <h3>Example:</h3>
    <pre id="modalExample"></pre>
    <h3>Output:</h3>
    <pre id="modalOutput"></pre>
  </div>
</div>

<script>
const topics = [
    {
        title: "Introduction to Java",
        explanation: "Java is a high-level, class-based, object-oriented programming language that is designed to have as few implementation dependencies as possible.",
        example: `public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
    }
}`,
        output: `Hello, Java!`
    },
    {
        title: "Data Types and Variables in Java",
        explanation: "Java supports various data types such as int, double, char, boolean, and more. Variables store data values.",
        example: `public class Main {
    public static void main(String[] args) {
        int age = 20;
        double price = 99.99;
        char grade = 'A';
        boolean isJavaFun = true;
        System.out.println(age + ", " + price + ", " + grade + ", " + isJavaFun);
    }
}`,
        output: `20, 99.99, A, true`
    },
    {
        title: "Conditionals and Loops in Java",
        explanation: "Conditionals (if-else, switch) and loops (for, while, do-while) control the flow of a program.",
        example: `public class Main {
    public static void main(String[] args) {
        int num = 5;
        if(num > 0) {
            System.out.println("Positive");
        }
        for(int i = 1; i <= 3; i++) {
            System.out.println("Count: " + i);
        }
    }
}`,
        output: `Positive
Count: 1
Count: 2
Count: 3`
    },
    {
        title: "Methods in Java",
        explanation: "Methods are blocks of code that perform a specific task and can be reused.",
        example: `public class Main {
    public static void greet() {
        System.out.println("Hello from method!");
    }
    public static void main(String[] args) {
        greet();
    }
}`,
        output: `Hello from method!`
    },
    {
        title: "Arrays in Java",
        explanation: "Arrays store multiple values of the same type in a single variable.",
        example: `public class Main {
    public static void main(String[] args) {
        int[] numbers = {1, 2, 3};
        for(int num : numbers) {
            System.out.println(num);
        }
    }
}`,
        output: `1
2
3`
    },
    {
        title: "Strings in Java",
        explanation: "Strings are sequences of characters. Java provides a String class with many methods for string manipulation.",
        example: `public class Main {
    public static void main(String[] args) {
        String name = "Java";
        System.out.println(name.toUpperCase());
    }
}`,
        output: `JAVA`
    },
    {
        title: "Object-Oriented Programming in Java",
        explanation: "OOP in Java includes concepts like classes, objects, inheritance, and polymorphism.",
        example: `class Car {
    String brand = "Toyota";
}
public class Main {
    public static void main(String[] args) {
        Car c = new Car();
        System.out.println(c.brand);
    }
}`,
        output: `Toyota`
    },
    {
        title: "Exception Handling in Java",
        explanation: "Java uses try-catch blocks to handle exceptions and prevent program crashes.",
        example: `public class Main {
    public static void main(String[] args) {
        try {
            int a = 5 / 0;
        } catch(Exception e) {
            System.out.println("Error: " + e.getMessage());
        }
    }
}`,
        output: `Error: / by zero`
    },
    {
        title: "Collections Framework (ArrayList, HashMap)",
        explanation: "Java's Collections Framework provides classes for storing and manipulating groups of objects.",
        example: `import java.util.*;
public class Main {
    public static void main(String[] args) {
        ArrayList<String> list = new ArrayList<>();
        list.add("Apple");
        list.add("Banana");
        System.out.println(list);

        HashMap<Integer, String> map = new HashMap<>();
        map.put(1, "One");
        map.put(2, "Two");
        System.out.println(map);
    }
}`,
        output: `[Apple, Banana]
{1=One, 2=Two}`
    }
];

function loadTopics() {
    const container = document.getElementById("topics");
    container.innerHTML = "";
    topics.forEach((t, index) => {
        const div = document.createElement("div");
        div.className = "topic";
        const title = document.createElement("span");
        title.textContent = t.title;
        if(localStorage.getItem("java_" + index) === "completed") {
            title.classList.add("completed");
        }
        const btns = document.createElement("div");

        const completeBtn = document.createElement("button");
        completeBtn.textContent = "Mark as Completed";
        completeBtn.className = "complete-btn";
        completeBtn.onclick = () => markCompleted(index, title);

        const viewBtn = document.createElement("button");
        viewBtn.textContent = "View Materials";
        viewBtn.className = "view-btn";
        viewBtn.onclick = () => openModal(t);

        btns.appendChild(completeBtn);
        btns.appendChild(viewBtn);

        div.appendChild(title);
        div.appendChild(btns);
        container.appendChild(div);
    });
}

function markCompleted(index, titleElement) {
    localStorage.setItem("java_" + index, "completed");
    titleElement.classList.add("completed");
}

function resetAll() {
    topics.forEach((_, index) => {
        localStorage.removeItem("java_" + index);
    });
    loadTopics();
}

function openModal(topic) {
    document.getElementById("modalTitle").textContent = topic.title;
    document.getElementById("modalExplanation").textContent = topic.explanation;
    document.getElementById("modalExample").textContent = topic.example;
    document.getElementById("modalOutput").textContent = topic.output;
    document.getElementById("materialModal").style.display = "block";
}

function closeModal() {
    document.getElementById("materialModal").style.display = "none";
}

window.onload = loadTopics;
</script>

</body>
</html>
