<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Study Materials</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .topic {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topic.completed span {
      text-decoration: line-through;
      color: gray;
    }
    button {
      margin-left: 5px;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .complete-btn {
      background-color: #4CAF50;
      color: white;
    }
    .view-btn {
      background-color: #2196F3;
      color: white;
    }
    .reset-btn { background-color: #f44336; color: white; display: block; margin: 20px auto; }
    .back-to-home{background-color: #f44336;color:white;text-decoration: none;}
    a{text-decoration: none;color:white}
    .jarvis {
        margin-top: 15px;
        padding: 15px;
        background: #fff3cd;
        border: 1px solid #ffeeba;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        color: #856404;
    }
    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background: white;
      margin: 10% auto;
      padding: 20px;
      width: 60%;
      border-radius: 8px;
    }
    .close {
      float: right;
      font-size: 24px;
      cursor: pointer;
    }
    pre {
      background: #eee;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
<button class="back-to-home"><a href="homepage.html">Back to home</a></button>
<h1>JavaScript</h1>

<div id="topics"></div>

<button class="reset-btn" onclick="resetAll()">Reset All</button>

<div class="jarvis">
  <strong>💡 For any doubts Jarvis can assist you</strong>
</div>

<!-- Modal -->
<div id="materialModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle"></h2>
    <p id="modalExplanation"></p>
    <h3>Example:</h3>
    <pre id="modalExample"></pre>
    <h3>Output:</h3>
    <pre id="modalOutput"></pre>
  </div>
</div>

<script>
const topics = [
  {
    title: "Introduction to JavaScript",
    explanation: "JavaScript is a scripting language used to create dynamic content on web pages.",
    example: `console.log("Hello, JavaScript!");`,
    output: `Hello, JavaScript!`
  },
  {
    title: "Variables and Data Types",
    explanation: "Variables store data. Data types include string, number, boolean, object, etc.",
    example: `let name = "Alice";\nlet age = 25;\nconsole.log(name, age);`,
    output: `Alice 25`
  },
  {
    title: "Operators",
    explanation: "Operators perform operations on variables and values. Examples: +, -, *, /, %, ===.",
    example: `let sum = 5 + 3;\nconsole.log(sum);`,
    output: `8`
  },
  {
    title: "Conditionals and Loops",
    explanation: "Conditionals run code based on conditions. Loops repeat tasks.",
    example: `for(let i=1; i<=3; i++) {\n  console.log(i);\n}`,
    output: `1\n2\n3`
  },
  {
    title: "Functions",
    explanation: "Functions are reusable blocks of code.",
    example: `function greet(name) {\n  return "Hello " + name;\n}\nconsole.log(greet("Bob"));`,
    output: `Hello Bob`
  },
  {
    title: "Arrays and Objects",
    explanation: "Arrays store lists of values. Objects store key-value pairs.",
    example: `let arr = [1,2,3];\nlet obj = {name: "Sam", age: 30};\nconsole.log(arr, obj);`,
    output: `[1, 2, 3] { name: 'Sam', age: 30 }`
  },
  {
    title: "DOM Manipulation",
    explanation: "DOM Manipulation allows changing HTML elements dynamically using JavaScript.",
    example: `document.getElementById("demo").innerHTML = "Changed!";`,
    output: `HTML element content changes to "Changed!"`
  },
  {
    title: "Events",
    explanation: "Events are actions like clicks, key presses, etc. You can respond to them using event listeners.",
    example: `document.getElementById("btn").addEventListener("click", function() {\n  alert("Button clicked!");\n});`,
    output: `Shows an alert when button is clicked`
  },
  {
    title: "ES6 Features",
    explanation: "ES6 introduced let/const, arrow functions, template literals, and more.",
    example: `const greet = name => \`Hello \${name}\`;\nconsole.log(greet("Max"));`,
    output: `Hello Max`
  }
];

function loadTopics() {
  const container = document.getElementById("topics");
  container.innerHTML = "";
  topics.forEach((topic, index) => {
    const completed = localStorage.getItem(`js_topic_${index}`) === "true";
    const topicDiv = document.createElement("div");
    topicDiv.className = "topic" + (completed ? " completed" : "");
    topicDiv.innerHTML = `
      <span>${topic.title}</span>
      <div>
        <button class="complete-btn" onclick="markCompleted(${index})">Mark as Completed</button>
        <button class="view-btn" onclick="viewMaterials(${index})">View Materials</button>
      </div>
    `;
    container.appendChild(topicDiv);
  });
}

function markCompleted(index) {
  localStorage.setItem(`js_topic_${index}`, "true");
  loadTopics();
}

function viewMaterials(index) {
  document.getElementById("modalTitle").innerText = topics[index].title;
  document.getElementById("modalExplanation").innerText = topics[index].explanation;
  document.getElementById("modalExample").innerText = topics[index].example;
  document.getElementById("modalOutput").innerText = topics[index].output;
  document.getElementById("materialModal").style.display = "block";
}

function closeModal() {
  document.getElementById("materialModal").style.display = "none";
}

function resetAll() {
  topics.forEach((_, index) => {
    localStorage.removeItem(`js_topic_${index}`);
  });
  loadTopics();
}

window.onclick = function(event) {
  const modal = document.getElementById("materialModal");
  if (event.target == modal) {
    closeModal();
  }
}

loadTopics();
</script>

</body>
</html>
