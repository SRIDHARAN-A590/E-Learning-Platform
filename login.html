<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login / Signup with Firebase</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      margin: 0;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0px 8px 25px rgba(0,0,0,0.15);
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }
    input:focus {
      border: 1px solid #2193b0;
      box-shadow: 0px 0px 5px rgba(33, 147, 176, 0.5);
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      background: linear-gradient(90deg, #2193b0, #6dd5ed);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }
    .error {
      color: red;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    p {
      text-align: center;
      font-size: 14px;
    }
    a {
      color: #2193b0;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <h2 id="formTitle">Sign Up</h2>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <div class="error" id="errorMsg"></div>
  <button id="authBtn">Sign Up</button>
  <p>
    <a href="#" id="toggleLink">Already have an account? Login</a>
  </p>
</div>

<script>
  // Your Firebase Config
  const firebaseConfig = {
  apiKey: "AIzaSyAEowASvDWlHjCGEmKa_P6o29SxwKG2Pwo",
  authDomain: "login-5721e.firebaseapp.com",
  projectId: "login-5721e",
  storageBucket: "login-5721e.firebasestorage.app",
  messagingSenderId: "479494937109",
  appId: "1:479494937109:web:5f050afa1cdbb65195cc1c"
};
  firebase.initializeApp(firebaseConfig);

  let isLogin = false;

  const formTitle = document.getElementById("formTitle");
  const authBtn = document.getElementById("authBtn");
  const toggleLink = document.getElementById("toggleLink");
  const errorMsg = document.getElementById("errorMsg");

  toggleLink.addEventListener("click", () => {
    isLogin = !isLogin;
    formTitle.textContent = isLogin ? "Login" : "Sign Up";
    authBtn.textContent = isLogin ? "Login" : "Sign Up";
    toggleLink.textContent = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login";
    errorMsg.textContent = "";
  });

  authBtn.addEventListener("click", () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (isLogin) {
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = "homepage.html";
        })
        .catch(() => {
          errorMsg.textContent = "Invalid email or password. Please sign up first.";
        });
    } else {
      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(() => {
          alert("Sign up successful! You can now log in.");
          isLogin = true;
          formTitle.textContent = "Login";
          authBtn.textContent = "Login";
          toggleLink.textContent = "Don't have an account? Sign Up";
        })
        .catch(error => {
          errorMsg.textContent = error.message;
        });
    }
  });
</script>

</body>
</html>
